{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Vendor Panel{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<section class="vendor-section">

<div class="container-fluid">

<div class="row">

    <!-- Sidebar -->

    <div class="col-lg-3">

        <div class="vendor-sidebar">

            <h2>🎂 CraftMyCake</h2>

            <hr>

            <a href="{% url 'vendor_dashboard' %}">
                📊 Dashboard
            </a>

            <a href="{% url 'vendor_profile' %}">
                👤 My Profile
            </a>

            <a href="{% url 'manage_cakes' %}">
                🍰 Manage Cakes
            </a>

            <a href="{% url 'add_cake' %}">
                ➕ Add Cake
            </a>

            <a href="{% url 'vendor_orders' %}">
                📦 Orders
            </a>

            <a href="{% url 'custom_requests' %}">
                🎨 Custom Requests
            </a>

            <a href="{% url 'logout_user' %}" class="text-danger">
                🚪 Logout
            </a>

        </div>

    </div>

    <!-- Main Content -->

    <div class="col-lg-9">

        {% block content %}
        {% endblock %}

    </div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
