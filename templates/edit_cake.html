{% extends 'base.html' %}

{% block title %}Edit Cake | CraftMyCake{% endblock %}

{% block content %}

<section class="vendor-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0">

<div class="card-header bg-warning text-dark">

<h2 class="mb-0">
✏️ Edit Cake
</h2>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="text-center mb-4">

{% if cake.image %}

<img src="/media/{{ cake.image }}"
     alt="{{ cake.cake_name }}"
     width="220"
     height="220"
     style="border-radius:15px;object-fit:cover;">

{% else %}

<img src="https://via.placeholder.com/220"
     width="220"
     height="220">

{% endif %}

</div>

<div class="mb-3">

<label class="form-label">

Cake Name

</label>

<input
type="text"
name="cake_name"
class="form-control"
value="{{ cake.cake_name }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Price

</label>

<input
type="number"
name="price"
class="form-control"
value="{{ cake.price }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Weight

</label>

<select
name="weight"
class="form-select">

<option value="500 gm"
{% if cake.weight == "500 gm" %}selected{% endif %}>
500 gm
</option>

<option value="1 Kg"
{% if cake.weight == "1 Kg" %}selected{% endif %}>
1 Kg
</option>

<option value="1.5 Kg"
{% if cake.weight == "1.5 Kg" %}selected{% endif %}>
1.5 Kg
</option>

<option value="2 Kg"
{% if cake.weight == "2 Kg" %}selected{% endif %}>
2 Kg
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Flavor

</label>

<input
type="text"
name="flavor"
class="form-control"
value="{{ cake.flavor }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea
name="description"
rows="4"
class="form-control"
required>{{ cake.description }}</textarea>

</div>

<div class="mb-4">

<label class="form-label">

Change Cake Image

</label>

<input
type="file"
name="image"
class="form-control">

<small class="text-muted">

Leave empty to keep the existing image.

</small>

</div>

<div class="d-flex justify-content-between">

<a href="{% url 'manage_cakes' %}"
class="btn btn-secondary">

← Cancel

</a>

<button
type="submit"
class="btn btn-warning">

💾 Save Changes

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
