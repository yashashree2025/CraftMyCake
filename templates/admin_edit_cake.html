{% extends 'admin_base.html' %}

{% block title %}Edit Cake | CraftMyCake{% endblock %}

{% block content %}

<style>

.edit-card{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    padding:35px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.edit-card h2{
    color:#ff4d8d;
    font-weight:bold;
}

.form-label{
    font-weight:600;
}

.form-control,
.form-select{
    border-radius:10px;
    height:48px;
}

textarea.form-control{
    height:120px;
}

.preview-img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
}

.btn-pink{
    background:#ff4d8d;
    color:#fff;
    border:none;
}

.btn-pink:hover{
    background:#e83e7a;
    color:#fff;
}

</style>

<section class="admin-section py-5">

<div class="container">

<div class="edit-card">

<div class="text-center mb-4">

<h2>🍰 Edit Cake</h2>

<p class="text-muted">
Update Cake Details
</p>

</div>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="row">

<div class="col-md-4 text-center mb-4">

{% if cake.image %}

<img
src="/media/{{ cake.image }}"
class="preview-img">

{% else %}

<img
src="https://via.placeholder.com/180x180?text=Cake"
class="preview-img">

{% endif %}

<div class="mt-3">

<label class="form-label">
Change Cake Image
</label>

<input
type="file"
name="image"
class="form-control">

</div>

</div>

<div class="col-md-8">

<div class="mb-3">

<label class="form-label">
Cake Name
</label>

<input
type="text"
name="cake_name"
class="form-control"
value="{{ cake.cake_name }}"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Category
</label>

<select
name="category"
class="form-select">

<option value="Birthday"
{% if cake.category == "Birthday" %}selected{% endif %}>
Birthday
</option>

<option value="Wedding"
{% if cake.category == "Wedding" %}selected{% endif %}>
Wedding
</option>

<option value="Anniversary"
{% if cake.category == "Anniversary" %}selected{% endif %}>
Anniversary
</option>

<option value="Photo Cake"
{% if cake.category == "Photo Cake" %}selected{% endif %}>
Photo Cake
</option>

<option value="Custom Cake"
{% if cake.category == "Custom Cake" %}selected{% endif %}>
Custom Cake
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Price (₹)
</label>

<input
type="number"
name="price"
class="form-control"
value="{{ cake.price }}"
required>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Weight
</label>

<input
type="text"
name="weight"
class="form-control"
value="{{ cake.weight }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Flavor
</label>

<input
type="text"
name="flavor"
class="form-control"
value="{{ cake.flavor }}"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">
Description
</label>

<textarea
name="description"
class="form-control"
required>{{ cake.description }}</textarea>

</div>

<div class="mb-4">

<label class="form-label">
Availability
</label>

<select
name="availability"
class="form-select">

<option value="Available"
{% if cake.availability == "Available" %}selected{% endif %}>
Available
</option>

<option value="Out of Stock"
{% if cake.availability == "Out of Stock" %}selected{% endif %}>
Out of Stock
</option>

</select>

</div>

<div class="text-center">

<button
type="submit"
class="btn btn-pink btn-lg">

💾 Update Cake

</button>

<a
href="{% url 'admin_cakes' %}"
class="btn btn-secondary btn-lg ms-2">

Cancel

</a>

</div>

</div>

</div>

</form>

</div>

</div>

</section>

{% endblock %}
