{% extends 'base.html' %}

{% block title %}Saved Address | CraftMyCake{% endblock %}

{% block content %}

<section class="profile-section py-5">

<div class="container">

    <div class="row">

        <!-- Left Sidebar -->
        <div class="col-lg-4">
            {% include 'profile_sidebar.html' %}
        </div>

        <!-- Right Content -->
        <div class="col-lg-8">

            <div class="welcome-card mb-4">

                <h2>📍 Saved Address</h2>

                <p>
                    Add or update your delivery address.
                </p>

            </div>

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>

                            <input
                                type="text"
                                name="fullname"
                                class="form-control"
                                value="{{ user.fullname }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ user.phone }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>

                            <textarea
                                name="address"
                                rows="3"
                                class="form-control"
                                required>{{ user.address }}</textarea>
                        </div>

                        <div class="row">

                            <div class="col-md-4 mb-3">

                                <label class="form-label">City</label>

                                <input
                                    type="text"
                                    name="city"
                                    class="form-control"
                                    value="{{ user.city }}"
                                    required>

                            </div>

                            <div class="col-md-4 mb-3">

                                <label class="form-label">State</label>

                                <input
                                    type="text"
                                    name="state"
                                    class="form-control"
                                    value="{{ user.state }}"
                                    required>

                            </div>

                            <div class="col-md-4 mb-3">

                                <label class="form-label">Pincode</label>

                                <input
                                    type="text"
                                    name="pincode"
                                    class="form-control"
                                    value="{{ user.pincode }}"
                                    required>

                            </div>

                        </div>

                        <button type="submit" class="btn btn-pink">

                            Save Address

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</section>

{% endblock %}
