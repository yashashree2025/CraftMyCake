{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body style="background:#f5f6fa;">

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 p-0">

            <div class="admin-sidebar">

                <h3>🎂 Admin</h3>

                <a href="{% url 'admin_dashboard' %}">📊 Dashboard</a>

                <a href="{% url 'manage_users' %}">👥 Users</a>

                <a href="{% url 'manage_vendors' %}">🏪 Vendors</a>

                <a href="{% url 'admin_cakes' %}">🍰 Cakes</a>

                <a href="{% url 'admin_orders' %}">📦 Orders</a>

                <a href="{% url 'contact_messages' %}">📞 Contacts</a>

                <a href="{% url 'logout_user' %}" class="logout-btn">
                    🚪 Logout
                </a>

            </div>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
